name: guck_mal_bingo
description: Guck mal! - Reise Bingo App für iOS und Android
publish_to: 'none'
version: 1.1.0+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Audio
  audioplayers: ^6.0.0

  # Storage
  shared_preferences: ^2.2.2

  # Utils
  uuid: ^4.3.3
  intl: ^0.20.0
  url_launcher: ^6.2.5
  package_info_plus: ^9.0.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

# Native Splash Screen Config
flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: false  # iOS hat schon LaunchScreen

flutter:
  uses-material-design: true

  # Assets
  assets:
    # Sounds
    - assets/sounds/

    # Images (alle 206 Bilder)
    - assets/images/

  # Fonts (falls benötigt)
  # fonts:
  #   - family: System
  #     fonts:
  #       - asset: fonts/System.ttf

  # Localization
  generate: true
