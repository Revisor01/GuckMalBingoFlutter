name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  xcode-cloud-skript:
    # Das Skript laeuft sonst erst in Xcode Cloud; hier gegen Kopien, damit eine
    # Aenderung an Version oder Signierung es nicht still bricht.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Skript gegen Kopien pruefen
        run: tool/xcode_cloud_test.sh
