version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Gebündelt gegen PR-Flut; Majors einzeln, weil sie oft Code-Anpassungen brauchen.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
