version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Gebündelt, damit nicht jedes Paket einen eigenen PR bekommt. Majors kommen
  # einzeln, weil sie oft Anpassungen am Code oder an den nativen Projekten brauchen.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      minor-und-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
